name: Build Prism IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Validate and unpack project
        run: |
          unzip -tq Prism-iOS-project.zip
          unzip -oq Prism-iOS-project.zip 'prism-ios/*'
          python3 prism-ios/scripts/verify-archive.py source Prism-iOS-project.zip

      - name: Build and test
        run: CI=true bash prism-ios/build-ipa.sh

      - name: Validate IPA
        run: |
          python3 prism-ios/scripts/verify-archive.py ipa prism-ios/build/Prism-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Prism-2.5.0-build-10-IPA
          path: |
            prism-ios/build/Prism-unsigned.ipa
            prism-ios/build/RELEASE.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prism-build-diagnostics
          path: |
            prism-ios/build/*build.log
            prism-ios/build/simulator-*.png
          if-no-files-found: ignore
